name: generate_pihole_eu_gov

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  convert-eu-gov:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Blocklist to Pi-hole
        run: |
          # Wir suchen die Datei 'eu-gov-tracker-blocklist' im Hauptverzeichnis
          if [ -f "eu-gov-tracker-blocklist" ]; then
            sed -e 's/||//g' -e 's/\^//g' -e '/^!/d' -e '/^\[/d' -e '/^$/d' "eu-gov-tracker-blocklist" > pihole-eu-gov.txt
            echo "✅ Conversion successful"
          else
            echo "❌ Error: File 'eu-gov-tracker-blocklist' not found!"
            ls -R # Zeigt uns im Log, welche Dateien wirklich da sind
            exit 1
          fi
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pihole-eu-gov.txt
          git commit -m "Update Pi-hole list [auto]" || echo "No changes"
          git push
