name: generate_pihole_eu_gov

on:
  push:
    branches:
      - main
    paths:
      - 'eu-gov-tracker-blocklist'
  workflow_dispatch:

jobs:
  convert-eu-gov:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Debug - List Files
        run: ls -la

      - name: Convert Blocklist to Pi-hole
        run: |
          # Sucht die Datei unabhängig von Groß-/Kleinschreibung
          SOURCE_FILE=$(ls | grep -i "eu-gov-tracker-blocklist" | head -n 1)
          
          if [ -n "$SOURCE_FILE" ]; then
            # Konvertierung zu Pi-hole Format (reine Domains)
            sed -e 's/||//g' -e 's/\^//g' -e '/^!/d' -e '/^\[/d' -e '/^$/d' "$SOURCE_FILE" > pihole-eu-gov.txt
            echo "✅ Conversion of $SOURCE_FILE successful"
          else
            echo "❌ Error: Source file 'eu-gov-tracker-blocklist' not found!"
            exit 1
          fi
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pihole-eu-gov.txt
          git commit -m "Update Pi-hole EU-Gov list [auto]" || echo "No changes to commit"
          git push
