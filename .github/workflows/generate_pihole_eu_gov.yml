name: generate_pihole_eu_gov

on:
  push:
    branches:
      - main
    paths:
      - 'EU-Gov-Tracker-Blocklist-by-madnesscc'
  workflow_dispatch:

jobs:
  convert-eu-gov:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Convert Blocklist to Pi-hole
        run: |
          # Sucht die Datei unabhängig von Groß-/Kleinschreibung
          SOURCE_FILE=$(ls | grep -i "blocklist" | grep -v ".md" | head -n 1)
          
          if [ -n "$SOURCE_FILE" ]; then
            echo "Found source file: $SOURCE_FILE"
            sed -e 's/||//g' -e 's/\^//g' -e '/^!/d' -e '/^\[/d' -e '/^$/d' "$SOURCE_FILE" > pihole-eu-gov.txt
            echo "✅ Conversion successful"
          else
            echo "❌ Error: No file with 'blocklist' in name found!"
            exit 1
          fi
          
      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add pihole-eu-gov.txt
          git commit -m "Update Pi-hole list [auto]" || echo "No changes to commit"
          git push
